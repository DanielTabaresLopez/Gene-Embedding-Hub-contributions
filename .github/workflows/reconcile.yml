name: Reconcile accepted and published submissions

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "huggingface_hub>=1.19.0" hf_xet
      - name: Download current community registry
        env:
          HF_OIDC_RESOURCE: datasets/BoevaLab/Gene-Embedding-Hub-dataset
        run: |
          mkdir -p current-state/registry

          hf download \
            BoevaLab/Gene-Embedding-Hub-dataset \
            data/community_contributions/community_registry.json \
            --repo-type dataset \
            --local-dir current-state/registry

          cp \
            current-state/registry/data/community_contributions/community_registry.json \
            current-state/community_registry.json

      - name: Find first merged submission missing from the HF registry
        id: missing
        run: |
          python scripts/find_unpublished.py \
            --registry-file current-state/community_registry.json \
            --submissions submissions \
            --github-output "$GITHUB_OUTPUT"
      - name: Dispatch the single trusted HF writer
        if: steps.missing.outputs.submission_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f mode=submission \
            -f submission_file="${{ steps.missing.outputs.submission_file }}" \
            -f accepted_commit=main
