name: Test trusted validator

on:
  push:
    branches: [main]
    paths:
      - "gene_registry/**"
      - "scripts/**"
      - "tests/**"
      - "schemas/**"
      - "config/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "gene_registry/**"
      - "scripts/**"
      - "tests/**"
      - "schemas/**"
      - "config/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
