name: Publish to Hugging Face

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publication mode
        required: true
        type: choice
        options:
          - submission
          - hf_portal_pr
          - bootstrap_space
          - sync_core_catalog
      submission_file:
        description: Merged submissions/*.yaml file (submission mode)
        required: false
        type: string
      accepted_commit:
        description: Trusted Git commit to publish from
        required: true
        default: main
        type: string
      hf_pr_number:
        description: Hugging Face Dataset Pull Request number
        required: false
        type: string
      hf_pr_author:
        description: Hugging Face username that opened the Pull Request
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-gene-embedding-library
  cancel-in-progress: false

jobs:
  publish-submission:
    if: inputs.mode == 'submission'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Validate workflow inputs
        env:
          SUBMISSION_FILE: ${{ inputs.submission_file }}
          ACCEPTED_COMMIT: ${{ inputs.accepted_commit }}
        run: |
          [[ "$SUBMISSION_FILE" =~ ^submissions/[A-Za-z0-9._-]+\.ya?ml$ ]]
          [[ "$ACCEPTED_COMMIT" =~ ^[0-9a-f]{40}$|^main$ ]]

      - name: Check out trusted accepted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "huggingface_hub>=1.19.0" hf_xet

      - name: Download current community registry
        env:
          HF_OIDC_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
        run: |
          mkdir -p current-state/registry

          hf download \
            embeddingsSSRF/gene_embeddings_staging \
            data/community_registry.json \
            --repo-type dataset \
            --local-dir current-state/registry

          cp \
            current-state/registry/data/community_registry.json \
            current-state/community_registry.json

      - name: Download current Space catalog
        env:
          HF_OIDC_RESOURCE: spaces/embeddingsSSRF/Gene-Embeddings-Staging
        run: |
          mkdir -p current-state/space

          hf download \
            embeddingsSSRF/Gene-Embeddings-Staging \
            catalog.json \
            --repo-type space \
            --local-dir current-state/space

          cp \
            current-state/space/catalog.json \
            current-state/catalog.json

      - name: Revalidate and prepare Dataset and Space payloads
        run: |
          python scripts/prepare_release.py \
            --submission "${{ inputs.submission_file }}" \
            --project config/project.yaml \
            --policy config/policy.yaml \
            --master-genes reference/master_gene_ids.txt \
            --schema-dir schemas \
            --space-source space \
            --existing-registry current-state/community_registry.json \
            --existing-catalog current-state/catalog.json \
            --output-dir dist

      - name: Publish package and registry to the Hugging Face Dataset
        env:
          HF_OIDC_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
        run: |
          hf upload \
            embeddingsSSRF/gene_embeddings_staging \
            dist/dataset \
            . \
            --repo-type dataset \
            --commit-message "Publish ${{ inputs.submission_file }}"

      - name: Publish regenerated Static Space
        env:
          HF_OIDC_RESOURCE: spaces/embeddingsSSRF/Gene-Embeddings-Staging
        run: |
          hf upload \
            embeddingsSSRF/Gene-Embeddings-Staging \
            dist/space \
            . \
            --repo-type space \
            --commit-message "Update catalog for ${{ inputs.submission_file }}"

  sync-core-catalog:
    if: inputs.mode == 'sync_core_catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out trusted catalog source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install catalog tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "huggingface_hub>=1.19.0" hf_xet

      - name: Prepare reviewed core catalog
        run: |
          mkdir -p dist-space current-space reports
          cp -a space/. dist-space/
          cp space/catalog.json dist-space/core_catalog.json

          python - <<'PYCODE'
          from pathlib import Path
          import json
          import yaml

          catalog = json.loads(
              Path("dist-space/core_catalog.json").read_text(
                  encoding="utf-8"
              )
          )

          project = yaml.safe_load(
              Path("config/project.yaml").read_text(
                  encoding="utf-8"
              )
          )

          expected_count = int(project["core_expected_count"])
          expected_dataset = project["core_dataset_id"]
          expected_revision = project["core_dataset_revision"]

          errors = []
          ids = []

          if not isinstance(catalog, list):
              errors.append("Catalog must contain a JSON list.")
          else:
              for entry in catalog:
                  embedding_id = entry.get("id")
                  ids.append(embedding_id)

                  if entry.get("community_contribution") is not False:
                      errors.append(
                          f"{embedding_id}: expected a core catalog entry"
                      )

                  if entry.get("source_dataset") != expected_dataset:
                      errors.append(
                          f"{embedding_id}: incorrect source Dataset"
                      )

                  if entry.get("source_revision") != expected_revision:
                      errors.append(
                          f"{embedding_id}: incorrect source revision"
                      )

                  if not entry.get("package_url"):
                      errors.append(
                          f"{embedding_id}: package URL is missing"
                      )

          if len(catalog) != expected_count:
              errors.append(
                  f"Expected {expected_count} entries, "
                  f"found {len(catalog)}"
              )

          if len(ids) != len(set(ids)):
              errors.append("Duplicate embedding IDs detected.")

          print("Reviewed core entries:", len(catalog))
          print("Unique embedding IDs:", len(set(ids)))
          print("Source Dataset:", expected_dataset)
          print("Source revision:", expected_revision)
          print("Validation errors:", len(errors))

          for error in errors:
              print(" -", error)

          if errors:
              raise SystemExit(1)

          print("Reviewed core catalog validation: PASS")
          PYCODE

      - name: Download current Space catalog
        env:
          HF_OIDC_RESOURCE: spaces/embeddingsSSRF/Gene-Embeddings-Staging
        run: |
          hf download \
            embeddingsSSRF/Gene-Embeddings-Staging \
            catalog.json \
            --repo-type space \
            --local-dir current-space || true

      - name: Preserve community additions and merge catalogs
        run: |
          python scripts/merge_space_catalogs.py \
            --core dist-space/core_catalog.json \
            --existing current-space/catalog.json \
            --output dist-space/catalog.json \
            --summary dist-space/release_summary.json

          rm dist-space/core_catalog.json

      - name: Publish synchronized catalog and static interface
        env:
          HF_OIDC_RESOURCE: spaces/embeddingsSSRF/Gene-Embeddings-Staging
        run: |
          hf upload \
            embeddingsSSRF/Gene-Embeddings-Staging \
            dist-space \
            . \
            --repo-type space \
            --commit-message "Synchronize frozen core embedding catalog"

  bootstrap-space:
    if: inputs.mode == 'bootstrap_space'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HF CLI
        run: python -m pip install "huggingface_hub>=1.19.0" hf_xet
      - name: Preserve the current remote catalog and prepare static files
        run: |
          mkdir -p dist-space current-space
          cp -a space/. dist-space/
          hf download \
            embeddingsSSRF/Gene-Embeddings-Staging \
            catalog.json \
            --repo-type space \
            --local-dir current-space || true
          if [ -f current-space/catalog.json ]; then
            cp current-space/catalog.json dist-space/catalog.json
          fi
      - name: Publish the static interface without replacing its catalog
        env:
          HF_OIDC_RESOURCE: spaces/embeddingsSSRF/Gene-Embeddings-Staging
        run: |
          hf upload \
            embeddingsSSRF/Gene-Embeddings-Staging \
            dist-space \
            . \
            --repo-type space \
            --commit-message "Bootstrap automatic contribution interface"

  publish-hf-portal-pr:
    if: inputs.mode == 'hf_portal_pr'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Validate workflow inputs
        env:
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
          HF_PR_AUTHOR: ${{ inputs.hf_pr_author }}
        run: |
          set -euo pipefail

          [[ "$HF_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "hf_pr_number must be a positive integer"
            exit 1
          }

          [[ "$HF_PR_AUTHOR" =~ ^[A-Za-z0-9._-]{1,96}$ ]] || {
            echo "hf_pr_author contains unsupported characters"
            exit 1
          }

      - name: Check out trusted portal code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install portal tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "huggingface_hub>=1.19.0" hf_xet

      - name: Inspect the Hugging Face PR repository trees
        id: inspect
        env:
          HF_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
        run: |
          set -euo pipefail

          mkdir -p hf-pr-state

          oidc_token="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fhuggingface.co" \
            | jq -er '.value'
          )"

          hf_token="$(
            jq -n \
              --arg subject_token "$oidc_token" \
              --arg resource "$HF_RESOURCE" \
              '{
                grant_type:
                  "urn:ietf:params:oauth:grant-type:token-exchange",
                subject_token_type:
                  "urn:ietf:params:oauth:token-type:id_token",
                subject_token: $subject_token,
                resource: $resource
              }' \
            | curl \
                --fail-with-body \
                --silent \
                --show-error \
                -X POST \
                -H "Content-Type: application/json" \
                --data-binary @- \
                https://huggingface.co/oauth/token \
            | jq -er '.access_token'
          )"

          echo "::add-mask::$hf_token"
          export HF_TOKEN="$hf_token"

          hf discussions info \
            embeddingsSSRF/gene_embeddings_staging \
            "$HF_PR_NUMBER" \
            --repo-type dataset \
            --format json \
            > hf-pr-state/info.json

          python scripts/build_hf_pr_diff.py \
            --repo-id \
              embeddingsSSRF/gene_embeddings_staging \
            --repo-type dataset \
            --pr-number "$HF_PR_NUMBER" \
            --info-json hf-pr-state/info.json \
            --output hf-pr-state/pr.diff \
            --summary-json \
              hf-pr-state/tree-comparison.json

          python scripts/inspect_hf_pr.py \
            --diff-file hf-pr-state/pr.diff \
            --output hf-pr-state/inspection.json

          embedding_id="$(
            jq -r '.embedding_id' \
              hf-pr-state/inspection.json
          )"

          package_path="$(
            jq -r '.package_path' \
              hf-pr-state/inspection.json
          )"

          echo "embedding_id=$embedding_id" \
            >> "$GITHUB_OUTPUT"

          echo "package_path=$package_path" \
            >> "$GITHUB_OUTPUT"

      - name: Download the proposed package from the PR revision
        env:
          HF_OIDC_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
          PACKAGE_PATH: ${{ steps.inspect.outputs.package_path }}
        run: |
          set -euo pipefail

          hf download \
            embeddingsSSRF/gene_embeddings_staging \
            --repo-type dataset \
            --revision "refs/pr/${HF_PR_NUMBER}" \
            --include "${PACKAGE_PATH}/*" \
            --local-dir pr-snapshot

          test -f \
            "pr-snapshot/${PACKAGE_PATH}/embeddings.npz"

          test -f \
            "pr-snapshot/${PACKAGE_PATH}/genes.tsv"

          test -f \
            "pr-snapshot/${PACKAGE_PATH}/metadata.json"

          test -f \
            "pr-snapshot/${PACKAGE_PATH}/README.md"

          test -f \
            "pr-snapshot/${PACKAGE_PATH}/submission.yaml"

      - name: Download the current community registry
        env:
          HF_OIDC_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
        run: |
          set -euo pipefail

          mkdir -p current-state/dataset

          hf download \
            embeddingsSSRF/gene_embeddings_staging \
            data/community_registry.json \
            --repo-type dataset \
            --local-dir current-state/dataset

      - name: Download the current Space catalog
        env:
          HF_OIDC_RESOURCE: spaces/embeddingsSSRF/Gene-Embeddings-Staging
        run: |
          set -euo pipefail

          mkdir -p current-state/space

          hf download \
            embeddingsSSRF/Gene-Embeddings-Staging \
            catalog.json \
            --repo-type space \
            --local-dir current-state/space

      - name: Validate and prepare the central release
        id: release
        env:
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
          HF_PR_AUTHOR: ${{ inputs.hf_pr_author }}
          PACKAGE_PATH: ${{ steps.inspect.outputs.package_path }}
        run: |
          set +e

          python scripts/prepare_portal_release.py \
            --package-dir "pr-snapshot/${PACKAGE_PATH}" \
            --submission \
              "pr-snapshot/${PACKAGE_PATH}/submission.yaml" \
            --project config/project.yaml \
            --policy config/policy.yaml \
            --modalities config/modalities.yaml \
            --master-genes reference/master_gene_ids.txt \
            --schema-dir schemas \
            --space-source space \
            --existing-registry \
              current-state/dataset/data/community_registry.json \
            --existing-catalog \
              current-state/space/catalog.json \
            --hf-pr-number "$HF_PR_NUMBER" \
            --hf-pr-author "$HF_PR_AUTHOR" \
            --output-dir dist

          code=$?

          echo "exit_code=$code" \
            >> "$GITHUB_OUTPUT"

          exit 0

      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-pr-${{ inputs.hf_pr_number }}-validation
          path: dist/reports
          if-no-files-found: warn
          retention-days: 30

      - name: Comment when validation fails
        if: steps.release.outputs.exit_code != '0'
        env:
          HF_OIDC_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
        run: |
          set -euo pipefail

          if [ -f dist/reports/validation_summary.md ]; then
            hf discussions comment \
              embeddingsSSRF/gene_embeddings_staging \
              "$HF_PR_NUMBER" \
              --repo-type dataset \
              --body-file \
                dist/reports/validation_summary.md
          else
            hf discussions comment \
              embeddingsSSRF/gene_embeddings_staging \
              "$HF_PR_NUMBER" \
              --repo-type dataset \
              --body \
                "Automatic validation failed before a complete report could be generated. Nothing was published."
          fi

      - name: Stop when validation did not strictly pass
        if: steps.release.outputs.exit_code != '0'
        run: |
          echo "The Hugging Face submission was not published."
          exit 1

      - name: Publish the accepted package centrally
        env:
          HF_OIDC_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
          EMBEDDING_ID: ${{ steps.inspect.outputs.embedding_id }}
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
        run: |
          set -euo pipefail

          hf upload \
            embeddingsSSRF/gene_embeddings_staging \
            dist/dataset \
            . \
            --repo-type dataset \
            --commit-message \
              "Accept ${EMBEDDING_ID} from HF PR #${HF_PR_NUMBER}"

      - name: Publish the updated static Space
        env:
          HF_OIDC_RESOURCE: spaces/embeddingsSSRF/Gene-Embeddings-Staging
          EMBEDDING_ID: ${{ steps.inspect.outputs.embedding_id }}
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
        run: |
          set -euo pipefail

          hf upload \
            embeddingsSSRF/Gene-Embeddings-Staging \
            dist/space \
            . \
            --repo-type space \
            --commit-message \
              "Add ${EMBEDDING_ID} from HF PR #${HF_PR_NUMBER}"

      - name: Report acceptance and close the Hugging Face PR
        env:
          HF_OIDC_RESOURCE: datasets/embeddingsSSRF/gene_embeddings_staging
          EMBEDDING_ID: ${{ steps.inspect.outputs.embedding_id }}
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
        run: |
          set -euo pipefail

          cp \
            dist/reports/validation_summary.md \
            hf-pr-success-comment.md

          cat >> hf-pr-success-comment.md <<EOF

          ## Publication

          The submission has been accepted and centrally archived as:

          \`data/embeddings/${EMBEDDING_ID}\`

          The registry and staging Space were updated automatically.
          EOF

          hf discussions comment \
            embeddingsSSRF/gene_embeddings_staging \
            "$HF_PR_NUMBER" \
            --repo-type dataset \
            --body-file hf-pr-success-comment.md

          hf discussions close \
            embeddingsSSRF/gene_embeddings_staging \
            "$HF_PR_NUMBER" \
            --repo-type dataset \
            --yes \
            --comment \
              "Accepted and centrally archived. Thank you for the contribution."

