name: Publish to Hugging Face
run-name: "${{ inputs.mode }} · HF PR ${{ inputs.hf_pr_number }} · ${{ inputs.hf_pr_revision }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publication mode
        required: true
        type: choice
        options:
          - submission
          - hf_portal_pr
          - bootstrap_space
          - sync_core_catalog
      submission_file:
        description: Merged submissions/*.yaml file (submission mode)
        required: false
        type: string
      accepted_commit:
        description: Trusted Git commit to publish from
        required: true
        default: main
        type: string
      hf_pr_number:
        description: Hugging Face Dataset Pull Request number
        required: false
        type: string
      hf_pr_revision:
        description: Immutable PR commit queued by discovery (optional for manual runs)
        required: false
        type: string
      hf_pr_author:
        description: Hugging Face username that opened the Pull Request
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-gene-embedding-library
  cancel-in-progress: false

jobs:
  publish-submission:
    if: inputs.mode == 'submission'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Validate workflow inputs
        env:
          SUBMISSION_FILE: ${{ inputs.submission_file }}
          ACCEPTED_COMMIT: ${{ inputs.accepted_commit }}
        run: |
          [[ "$SUBMISSION_FILE" =~ ^submissions/[A-Za-z0-9._-]+\.ya?ml$ ]]
          [[ "$ACCEPTED_COMMIT" =~ ^[0-9a-f]{40}$|^main$ ]]

      - name: Check out trusted accepted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "huggingface_hub==2.2.0" hf_xet

      - name: Read current public registry and catalogue
        run: python -m scripts.fetch_current_state --output current-state

      - name: Revalidate and prepare Dataset and Space payloads
        run: |
          python scripts/prepare_release.py \
            --submission "${{ inputs.submission_file }}" \
            --project config/project.yaml \
            --policy config/policy.yaml \
            --master-genes reference/master_gene_ids.txt \
            --schema-dir schemas \
            --space-source space \
            --existing-registry current-state/community_registry.json \
            --existing-catalog current-state/catalog.json \
            --output-dir dist

      - name: Publish package and registry to the Hugging Face Dataset
        env:
          HF_OIDC_RESOURCE: datasets/BoevaLab/Gene-Embedding-Hub-dataset
        run: |
          hf upload \
            BoevaLab/Gene-Embedding-Hub-dataset \
            dist/dataset \
            . \
            --repo-type dataset \
            --commit-message "Publish ${{ inputs.submission_file }}"

      - name: Publish regenerated Static Space
        env:
          HF_OIDC_RESOURCE: spaces/BoevaLab/Gene-Embedding-Hub
        run: |
          hf upload \
            BoevaLab/Gene-Embedding-Hub \
            dist/space \
            . \
            --repo-type space \
            --commit-message "Update catalog for ${{ inputs.submission_file }}"

  sync-core-catalog:
    if: inputs.mode == 'sync_core_catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out trusted catalog source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install catalog tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "huggingface_hub==2.2.0" hf_xet

      - name: Prepare reviewed core catalog
        run: |
          mkdir -p dist-space current-space reports
          cp -a space/. dist-space/
          cp space/catalog.json dist-space/core_catalog.json

          python - <<'PYCODE'
          from pathlib import Path
          import json
          import yaml

          catalog = json.loads(
              Path("dist-space/core_catalog.json").read_text(
                  encoding="utf-8"
              )
          )

          project = yaml.safe_load(
              Path("config/project.yaml").read_text(
                  encoding="utf-8"
              )
          )

          expected_count = int(project["core_expected_count"])
          expected_dataset = project["core_dataset_id"]
          expected_revisions = set(project.get("core_source_revisions", [project["core_dataset_revision"]]))

          errors = []
          ids = []

          if not isinstance(catalog, list):
              errors.append("Catalog must contain a JSON list.")
          else:
              for entry in catalog:
                  embedding_id = entry.get("id")
                  ids.append(embedding_id)

                  if entry.get("community_contribution") is not False:
                      errors.append(
                          f"{embedding_id}: expected a core catalog entry"
                      )

                  if entry.get("source_dataset") != expected_dataset:
                      errors.append(
                          f"{embedding_id}: incorrect source Dataset"
                      )

                  if entry.get("source_revision") not in expected_revisions:
                      errors.append(
                          f"{embedding_id}: incorrect source revision"
                      )

                  if not entry.get("package_url"):
                      errors.append(
                          f"{embedding_id}: package URL is missing"
                      )

          if len(catalog) != expected_count:
              errors.append(
                  f"Expected {expected_count} entries, "
                  f"found {len(catalog)}"
              )

          if len(ids) != len(set(ids)):
              errors.append("Duplicate embedding IDs detected.")

          print("Reviewed core entries:", len(catalog))
          print("Unique embedding IDs:", len(set(ids)))
          print("Source Dataset:", expected_dataset)
          print("Source revisions:", sorted(expected_revisions))
          print("Validation errors:", len(errors))

          for error in errors:
              print(" -", error)

          if errors:
              raise SystemExit(1)

          print("Reviewed core catalog validation: PASS")
          PYCODE

      - name: Download current Space catalog
        run: |
          hf download \
            BoevaLab/Gene-Embedding-Hub \
            catalog.json \
            --repo-type space \
            --local-dir current-space

      - name: Preserve community additions and merge catalogs
        run: |
          python scripts/merge_space_catalogs.py \
            --core dist-space/core_catalog.json \
            --existing current-space/catalog.json \
            --output dist-space/catalog.json \
            --summary dist-space/release_summary.json

          rm dist-space/core_catalog.json

      - name: Publish synchronized catalog and static interface
        env:
          HF_OIDC_RESOURCE: spaces/BoevaLab/Gene-Embedding-Hub
        run: |
          hf upload \
            BoevaLab/Gene-Embedding-Hub \
            dist-space \
            . \
            --repo-type space \
            --commit-message "Synchronize frozen core embedding catalog"

  bootstrap-space:
    if: inputs.mode == 'bootstrap_space'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HF CLI
        run: python -m pip install "huggingface_hub==2.2.0" hf_xet
      - name: Preserve the current remote catalog and prepare static files
        run: |
          mkdir -p dist-space current-space
          cp -a space/. dist-space/
          hf download \
            BoevaLab/Gene-Embedding-Hub \
            catalog.json \
            --repo-type space \
            --local-dir current-space
          if [ -f current-space/catalog.json ]; then
            cp current-space/catalog.json dist-space/catalog.json
          fi
          python -m scripts.refresh_catalog_summary --catalog dist-space/catalog.json --output dist-space/release_summary.json
      - name: Publish the static interface without replacing its catalog
        env:
          HF_OIDC_RESOURCE: spaces/BoevaLab/Gene-Embedding-Hub
        run: |
          hf upload \
            BoevaLab/Gene-Embedding-Hub \
            dist-space \
            . \
            --repo-type space \
            --commit-message "Bootstrap automatic contribution interface"

  publish-hf-portal-pr:
    if: inputs.mode == 'hf_portal_pr'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install trusted portal tooling
        run: python -m pip install -e . "huggingface_hub==2.2.0"
      - name: Validate workflow inputs
        env:
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
          HF_PR_REVISION: ${{ inputs.hf_pr_revision }}
          HF_PR_TOKEN: ${{ secrets.HF_PR_TOKEN }}
        run: |
          [[ "$HF_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$HF_PR_REVISION" || "$HF_PR_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test -n "$HF_PR_TOKEN" || { echo "Configure the existing HF_PR_TOKEN secret for PR feedback"; exit 1; }
      - name: Inspect the complete PR at an immutable commit
        id: inspect
        env:
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
          HF_PR_REVISION: ${{ inputs.hf_pr_revision }}
        run: |
          python -m scripts.inspect_portal_pr \
            --repo-id BoevaLab/Gene-Embedding-Hub-contributions-staging \
            --pr-number "$HF_PR_NUMBER" \
            --expected-revision "$HF_PR_REVISION" \
            --output hf-pr-state/inspection.json
          jq -r '"head_sha=\(.head_sha)", "package_path=\(.package_path)", "embedding_id=\(.embedding_id)", "pr_author=\(.pr_author)"' hf-pr-state/inspection.json >> "$GITHUB_OUTPUT"
      - name: Download exactly the inspected package revision
        env:
          HF_PR_REVISION: ${{ steps.inspect.outputs.head_sha }}
          PACKAGE_PATH: ${{ steps.inspect.outputs.package_path }}
        run: |
          hf download BoevaLab/Gene-Embedding-Hub-contributions-staging \
            --repo-type dataset --revision "$HF_PR_REVISION" \
            --include "$PACKAGE_PATH/*" --local-dir pr-snapshot
      - name: Read current public registry and catalogue
        run: python -m scripts.fetch_current_state --output current-state
      - name: Validate and prepare the release
        id: release
        env:
          PACKAGE_PATH: ${{ steps.inspect.outputs.package_path }}
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
          HF_PR_AUTHOR: ${{ steps.inspect.outputs.pr_author }}
          HF_PR_REVISION: ${{ steps.inspect.outputs.head_sha }}
        run: |
          python -m scripts.prepare_portal_release \
            --package-dir "pr-snapshot/$PACKAGE_PATH" \
            --submission "pr-snapshot/$PACKAGE_PATH/submission.yaml" \
            --project config/project.yaml --policy config/policy.yaml \
            --modalities config/modalities.yaml --master-genes reference/master_gene_ids.txt \
            --schema-dir schemas --space-source space \
            --existing-registry current-state/community_registry.json \
            --existing-catalog current-state/catalog.json \
            --hf-pr-number "$HF_PR_NUMBER" --hf-pr-author "$HF_PR_AUTHOR" \
            --hf-pr-revision "$HF_PR_REVISION" --output-dir dist
      - name: Publish the accepted package and registry
        id: dataset
        env:
          HF_OIDC_RESOURCE: datasets/BoevaLab/Gene-Embedding-Hub-dataset
          EMBEDDING_ID: ${{ steps.inspect.outputs.embedding_id }}
        run: |
          python -m scripts.publish_payload --target dataset --folder dist/dataset \
            --message "Accept $EMBEDDING_ID from a validated Hugging Face PR"
      - name: Publish catalogue data while preserving the interface
        id: space
        env:
          HF_OIDC_RESOURCE: spaces/BoevaLab/Gene-Embedding-Hub
          EMBEDDING_ID: ${{ steps.inspect.outputs.embedding_id }}
        run: |
          python -m scripts.publish_payload --target space --folder dist/space \
            --message "Add $EMBEDDING_ID to the catalogue"
      - name: Preserve reports and inspected revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-pr-${{ inputs.hf_pr_number }}-${{ github.run_id }}
          path: |
            dist/reports
            hf-pr-state
            current-state/state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report the outcome and close only the accepted revision
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_PR_TOKEN }}
          HF_PR_NUMBER: ${{ inputs.hf_pr_number }}
          HF_PR_REVISION: ${{ inputs.hf_pr_revision }}
          PUBLISHED: ${{ steps.dataset.outcome == 'success' && steps.space.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m scripts.finalize_portal_run \
            --repo-id BoevaLab/Gene-Embedding-Hub-contributions-staging \
            --pr-number "$HF_PR_NUMBER" --requested-revision "$HF_PR_REVISION" \
            --published "$PUBLISHED" --run-url "$RUN_URL"
