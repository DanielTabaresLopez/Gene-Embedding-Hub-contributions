schema_version: 1
embedding_id: replace_with_unique_embedding_id
display_name: Replace with the displayed embedding name
contributor:
  name: Replace with contributor name
  affiliation: Replace with institution or organization
scientific:
  broad_modality: Protein
  detailed_modality: Replace with a precise modality description
  original_method: Replace with the model or generation method
  model_checkpoint: Replace with checkpoint/version or not-applicable
  source_publication: ''
  description: Replace this text with a clear description of the embedding, how it
    was generated, and its intended use.
provenance:
  embedding_generated_by: Replace with model, software, or authors
  input_data_source: Replace with the original data source
  input_data_release: Replace with version or release
  species: Homo sapiens
  pooling_strategy: Replace with pooling strategy or not-applicable
  identifier_before_mapping: Replace with original identifier type
  mapping_method: Replace with the identifier mapping procedure
licensing:
  source_license: cc-by-4.0
  redistribution_allowed: true
  terms_url: Replace with the applicable license or terms URL
attestations:
  information_is_accurate: true
  rights_to_redistribute: true
  no_sensitive_human_data: true
  no_patient_level_data: true
  source_terms_reviewed: true
  acceptance_of_automatic_checks: true
