schema_version: 1

limits:
  max_candidate_download_bytes: 3500000000
  max_npz_uncompressed_bytes: 5000000000
  max_submission_yaml_bytes: 65536
  min_genes: 1500
  max_genes: 25000
  min_dimensions: 2
  max_dimensions: 50000

matrix:
  required_key: embeddings
  required_dtype: float32
  require_two_dimensions: true
  fail_on_nan_or_infinity: true
  fail_on_zero_vectors: true
  fail_on_duplicate_vectors: false
  fail_on_constant_columns: false

identifiers:
  required_column: ensembl_gene_id
  ensembl_pattern: '^ENSG[0-9]{11}$'
  require_unique: true
  require_unversioned: true
  minimum_master_coverage_fraction: 0.05
  maximum_unknown_fraction: 0.02

metadata:
  allowed_species:
    - Homo sapiens
  allowed_licenses:
    - apache-2.0
    - bsd-3-clause
    - cc-by-4.0
    - cc0-1.0
    - mit
    - odc-by-1.0

acceptance:
  warnings_are_failures: true
  require_all_attestations: true
  biological_checks_enabled: false
  exact_duplicate_checksum_fails: true
